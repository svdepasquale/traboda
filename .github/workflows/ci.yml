name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the OS version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' src/traboda/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but src/traboda/__init__.py has VERSION = \"$version\""
            exit 1
          fi
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          IDF_PATH=/opt/esp/idf ./firmware/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traboda-firmware
          path: firmware/dist/*.bin

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build MicroPython (unix) and mpy-cross
        run: |
          git clone --depth 1 -b v1.29.0 https://github.com/micropython/micropython.git firmware/.build/micropython
          make -C firmware/.build/micropython/mpy-cross -j"$(nproc)"
          make -C firmware/.build/micropython/ports/unix submodules
          make -C firmware/.build/micropython/ports/unix -j"$(nproc)"
      - name: Smoke tests
        run: python3 tests/smoke.py --micropython firmware/.build/micropython/ports/unix/build-standard/micropython

  # A pushed tag vX.Y.Z publishes the firmware the jobs above built and tested as a GitHub
  # Release, which tools/flash.py --download fetches.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: traboda-firmware
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum bootloader.bin partition-table.bin traboda.bin > SHA256SUMS
          gh release create "$TAG" bootloader.bin partition-table.bin traboda.bin SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Traboda OS $TAG" \
            --notes "Install or update: see the README. First install: python3 tools/flash.py --download --erase-fs"
